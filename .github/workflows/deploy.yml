name: GitHub Pages Astro CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Allows cloning the repository and deploying the project
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v5
      - name: Install, build, and upload your site
        uses: withastro/action@v5
        with:
          # Matches the Node version used locally. withastro/action@v6 defaults to
          # Node 24, which this Astro 3 project has not been verified against.
          node-version: "22"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
